name: Axiom CI

# Why: main receives locally verified candidates directly; D45 adds a Linux second signal.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: axiom-ci-${{ github.ref }}
  cancel-in-progress: true

# Why: ubuntu-latest moves to Ubuntu 26 from 2026-10-19; a pinned image keeps the second signal
# stable until a deliberate migration. The dependency install runs at most twice because one
# npm registry timeout in pnpm's own download failed every job of run #42 before any check ran.
jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node dependencies
        id: deps
        continue-on-error: true
        uses: ./.github/actions/install-node-dependencies

      - name: Wait before retrying the install
        if: steps.deps.outcome == 'failure'
        run: sleep 30

      - name: Install Node dependencies (retry)
        if: steps.deps.outcome == 'failure'
        uses: ./.github/actions/install-node-dependencies

      - name: Typecheck Node
        run: pnpm tc:node

      - name: Typecheck CLI
        run: pnpm tc:cli

      - name: Typecheck web
        run: pnpm tc:web

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node dependencies
        id: deps
        continue-on-error: true
        uses: ./.github/actions/install-node-dependencies

      - name: Wait before retrying the install
        if: steps.deps.outcome == 'failure'
        run: sleep 30

      - name: Install Node dependencies (retry)
        if: steps.deps.outcome == 'failure'
        uses: ./.github/actions/install-node-dependencies

      - name: Full lint chain
        run: pnpm lint

  axiom-tests:
    name: Axiom tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node dependencies
        id: deps
        continue-on-error: true
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      - name: Wait before retrying the install
        if: steps.deps.outcome == 'failure'
        run: sleep 30

      - name: Install Node dependencies (retry)
        if: steps.deps.outcome == 'failure'
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      - name: Axiom-scoped unit tests
        run: |
          ORCA_BACKGROUND_LAUNCH=1 pnpm exec vitest run --config config/vitest.config.ts \
            src/main/axiom \
            src/shared/axiom-contract \
            src/main/runtime/rpc/methods/axiom \
            src/main/runtime/orchestration/db/schema \
            src/cli/specs \
            src/cli/handlers/axiom \
            src/renderer/src/components/missions \
            src/renderer/src/lib/axiom-client.test.ts \
            src/renderer/src/lib/missions-view.test.ts \
            tests/e2e/helpers/fixture-plan-proposal.unit.test.ts
